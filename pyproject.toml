[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rline-pipeline"
version = "0.1.0"
description = "Configuracao, parsing e validacao de casos AERMOD/RLINE"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.18,<5",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[tool.setuptools.packages.find]
include = ["rline_pipeline*"]

[tool.setuptools.package-data]
rline_pipeline = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
  "scientific: slow model executions excluded from the fast test suite",
]

[tool.ruff]
target-version = "py311"
line-length = 100
